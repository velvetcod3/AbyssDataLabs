name: OpenDataBay Daily Data Engine

on:
  schedule:
    # Runs automatically every day at 06:00 UTC
    - cron: '0 6 * * *'
  # Allows manual triggers anytime from GitHub
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R Packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ubuntu-r-${{ hashFiles('**/pipeline.R') }}
          restore-keys: |
            ubuntu-r-

      - name: Install R Dependencies
        run: |
          Rscript -e '
            packages <- c("dplyr", "stringr", "httr", "jsonlite", "tibble", "syuzhet", "quanteda", "quanteda.textstats", "arrow", "readr", "knitr")
            new_packages <- packages[!(packages %in% installed.packages()[,"Package"])]
            if(length(new_packages)) install.packages(new_packages, repos="https://cloud.r-project.org")
          '

      - name: Run Pipeline Script
        run: Rscript pipeline.R

      - name: Commit and Push Updated Data Feeds
        run: |
          git config --global user.name "OpenDataBay Bot"
          git config --global user.email "bot@opendatabay.co.uk"
          git add .
          git commit -m "Automated Daily Data Refresh [$(date -u +'%Y-%m-%d %H:%M UTC')]" || echo "No changes to commit"
          git push